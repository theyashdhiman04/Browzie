<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pick a profile</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; }
  main { width: 420px; margin: 40px auto; }
  /* like a saved-account picker: a short list that scrolls by itself, with buttons
     right below it, so a row past its end sits over those buttons */
  .list { max-height: 248px; overflow-y: auto; border: 1px solid #ccc; }
  .list button { display: block; width: 100%; height: 62px; text-align: left; padding: 0 16px; border: 0; border-bottom: 1px solid #eee; background: #fff; }
  .after { position: relative; margin-top: -40px; padding-top: 48px; background: #fff; }
  .after button { display: block; width: 100%; height: 44px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Log in</h1>
  <div class="list" role="tablist" id="list"></div>
  <div class="after">
    <button>Use another profile</button>
    <button>Create new account</button>
  </div>
  <p id="out">Nothing picked</p>
</main>
<script>
  const names = ['alpha', 'bravo', 'charlie', 'delta', 'echo', 'foxtrot', 'golf', 'hotel'];
  const list = document.getElementById('list');
  for (const n of names) {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => (document.getElementById('out').textContent = 'Picked ' + n);
    list.appendChild(b);
  }
</script>
</body>
</html>
