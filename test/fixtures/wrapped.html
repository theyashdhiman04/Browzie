<!doctype html><meta charset=utf-8><title>Wrapped</title><h1>Wrapped</h1>
<!-- YouTube keeps its dialogs in a zero-height, absolutely positioned container at the top edge -->
<div style="position:absolute;top:0;left:0;width:100%;height:0">
  <div role=dialog aria-label="Channel" style="position:fixed;top:80px;left:60px;width:320px;height:160px;background:#eee;padding:12px">
    <p>How you'll appear</p>
    <button id=pick onclick="this.textContent = 'Picked'">Select picture</button>
  </div>
</div>
<div style="position:absolute;left:-9999px;top:0">Off-page text</div>
