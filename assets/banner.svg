<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Browzie: your Chrome, a visible cursor, real input">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a2a"/>
      <stop offset="0.55" stop-color="#2e1565"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="380" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#dots)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="84" y="178" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-2">Browzie</text>
    <text x="88" y="236" font-size="30" font-weight="500" fill="#ddd6fe">Your Chrome. A visible cursor. Real input.</text>
    <g font-size="17" font-weight="600" fill="#ede9fe">
      <rect x="88" y="270" width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c4b5fd" stroke-opacity="0.4"/>
      <text x="157" y="292" text-anchor="middle">MCP server</text>
      <rect x="238" y="270" width="174" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c4b5fd" stroke-opacity="0.4"/>
      <text x="325" y="292" text-anchor="middle">Chrome extension</text>
      <rect x="424" y="270" width="182" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c4b5fd" stroke-opacity="0.4"/>
      <text x="515" y="292" text-anchor="middle">On-screen cursor</text>
    </g>
  </g>

  <!-- mock browser window -->
  <g transform="translate(748 58)">
    <rect width="452" height="264" rx="16" fill="#1b1036" filter="url(#soft)"/>
    <rect width="452" height="264" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#c4b5fd" stroke-opacity="0.35"/>
    <circle cx="22" cy="21" r="5.5" fill="#f87171"/>
    <circle cx="40" cy="21" r="5.5" fill="#fbbf24"/>
    <circle cx="58" cy="21" r="5.5" fill="#34d399"/>
    <rect x="82" y="12" width="300" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
    <!-- viewport outlined like the live overlay frame -->
    <rect x="10" y="42" width="432" height="212" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="34" y="66" width="190" height="14" rx="7" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="34" y="92" width="300" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.11"/>
    <rect x="34" y="110" width="262" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.11"/>
    <rect x="34" y="128" width="282" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.11"/>
    <rect x="34" y="158" width="170" height="30" rx="7" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="278" y="186" width="144" height="38" rx="10" fill="#7c3aed"/>
    <text x="294" y="211" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Continue</text>
    <!-- the cursor's curved path and click ripple -->
    <path d="M 58 236 C 150 240, 170 140, 262 150 S 360 196, 394 205" fill="none" stroke="#c4b5fd" stroke-opacity="0.75" stroke-width="3" stroke-dasharray="1 11" stroke-linecap="round"/>
    <circle cx="394" cy="205" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="394" cy="205" r="27" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <!-- arrow cursor, tip on the click point -->
    <g transform="translate(394 205) scale(2.15)" filter="url(#shadow)">
      <polygon points="0,0 0,17 4.2,13.2 7.2,20 10,18.8 7.1,12.2 12.5,12.2" fill="#7c3aed" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
